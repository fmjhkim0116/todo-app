<title>위클리 버킷 패스포트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    --bg-start: #f8fafc;
    --bg-end: #e0f2fe;
    --accent: #0ea5e9;
    --accent-contrast: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --card-bg: rgba(255, 255, 255, 0.72);
    --card-border: rgba(255, 255, 255, 0.6);
    --surface-2: rgba(226, 232, 240, 0.55);
    --border: #e2e8f0;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 20px 40px -22px rgba(15, 23, 42, 0.22);
    --shadow-hover: 0 1px 2px rgba(15, 23, 42, 0.06), 0 30px 56px -22px rgba(15, 23, 42, 0.3);
    --radius: 20px;
    --space: 24px;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Pretendard', -apple-system, 'Noto Sans KR', sans-serif;
    padding-inline: 16px;
    padding-block: 32px;
  }
  .wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--space); }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: no-preference) {
    .wrap > * { animation: fadeInUp 0.5s ease both; }
    .wrap > *:nth-child(1) { animation-delay: 0s; }
    .wrap > *:nth-child(2) { animation-delay: 0.06s; }
    .wrap > *:nth-child(3) { animation-delay: 0.12s; }
    .wrap > *:nth-child(n+4) { animation-delay: 0.16s; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  .cover {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    color: var(--text);
    border-radius: var(--radius);
    padding: 28px 24px;
    box-shadow: var(--shadow);
    position: relative;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .cover:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
  .cover-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 6px;
  }
  .cover h1 {
    font-size: clamp(1.4rem, 4.5vw, 1.85rem);
    font-weight: 700;
    margin: 0 0 6px;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }
  .cover p.sub {
    margin: 0;
    color: var(--muted);
    font-size: 0.92rem;
    line-height: 1.5;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: var(--space);
  }
  .progress-track {
    flex: 1;
    height: 8px;
    border-radius: 999px;
    background: var(--surface-2);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.4s ease;
  }
  .progress-count {
    font-family: 'JetBrains Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 0.8rem;
    color: var(--accent);
    font-weight: 600;
    white-space: nowrap;
  }

  .week-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: var(--radius);
    padding: var(--space);
    box-shadow: var(--shadow);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .week-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
  .week-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
  }
  .week-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .week-number {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--accent);
  }
  .cat-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface-2);
    color: var(--accent);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 0.78rem;
    font-weight: 600;
    transition: background-color 0.2s ease, color 0.2s ease;
  }
  .week-item {
    font-size: clamp(1.05rem, 3.5vw, 1.3rem);
    font-weight: 700;
    line-height: 1.35;
    margin: 16px 0 var(--space);
    text-wrap: balance;
  }
  .week-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .btn {
    font-family: inherit;
    font-weight: 600;
    font-size: 0.85rem;
    border-radius: 10px;
    padding: 9px 16px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-contrast);
  }
  .btn.primary.done {
    background: var(--surface-2);
    border-color: var(--accent);
    color: var(--accent);
  }
  .btn.ghost {
    background: transparent;
  }

  .settings-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    color: var(--muted);
    flex-wrap: wrap;
    margin-top: var(--space);
  }
  .settings-row input[type="date"] {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 8px;
    background: #ffffff;
    color: var(--text);
  }
  .settings-row input[type="date"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .jumpnav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 2;
    padding-block: 6px;
  }
  .jumpnav a {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.76rem;
    text-decoration: none;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 11px;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(8px);
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .jumpnav a:hover, .jumpnav a:focus-visible { background: var(--accent); color: var(--accent-contrast); outline: none; }

  .page-section {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .page-section:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
  .page-head {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }
  .page-letter {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--accent);
    border: 1.5px solid var(--accent);
    border-radius: 10px;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .page-head h2 {
    font-size: 1.05rem;
    font-weight: 700;
    margin: 0;
  }
  .page-count {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 0.76rem;
    color: var(--muted);
    white-space: nowrap;
  }

  ul.item-list { list-style: none; margin: 0; padding: 0; }
  .item-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
  }
  .item-row:last-child { border-bottom: none; }
  .stamp-check {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px dashed var(--muted);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    color: transparent;
    cursor: pointer;
    margin-top: 1px;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }
  .stamp-check:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .stamp-check svg { width: 13px; height: 13px; }
  .item-row.done .stamp-check {
    border-style: solid;
    border-color: var(--accent);
    background: var(--accent);
    color: var(--accent-contrast);
  }
  .item-code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    flex-shrink: 0;
    margin-top: 3px;
    width: 28px;
  }
  .item-text {
    flex: 1;
    font-size: 0.94rem;
    line-height: 1.5;
  }
  .item-row.done .item-text {
    color: var(--muted);
    text-decoration: line-through;
  }

  footer.note {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    padding-block: 8px 20px;
  }

  @media (max-width: 420px) {
    body { padding-inline: 12px; }
    .item-row { padding-inline: 14px; }
    .page-head { padding-inline: 14px; }
  }
</style>

<div class="wrap">
  <div class="cover">
    <p class="cover-eyebrow">Weekly Bucket Passport</p>
    <h1>우리 부부의 위클리 버킷 패스포트</h1>
    <p class="sub">16주 주기로 나들이·집콕·운동·문화·요리·스페셜·영화·공연·음악·음식·숙소·자연휴양림·역사문학·국내여행·해외여행·독서까지 돌아가며, 매주 하나씩 도장을 찍어갑니다.</p>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-count" id="progressCount">0 / 100</span>
    </div>
  </div>

  <div class="week-card">
    <div class="week-card-top">
      <div>
        <div class="week-label">이번 주 스탬프</div>
        <div class="week-number" id="weekNumber">1주차</div>
      </div>
      <span class="cat-tag" id="weekCatTag">A · 근교 나들이</span>
    </div>
    <p class="week-item" id="weekItemText">—</p>
    <div class="week-actions">
      <button class="btn primary" id="weekDoneBtn" type="button">이번 주 완료로 표시</button>
      <button class="btn ghost" id="weekRerollBtn" type="button">같은 주제로 다른 항목</button>
    </div>
    <div class="settings-row" style="margin-top:14px;">
      <span>시작일</span>
      <input type="date" id="startDateInput" aria-label="시작일" />
      <span>기준으로 주차를 계산합니다</span>
    </div>
  </div>

  <nav class="jumpnav" id="jumpnav"></nav>

  <div id="sections"></div>

  <footer class="note">체크와 시작일은 이 브라우저에만 저장됩니다.</footer>
</div>

      var parsed = JSON.parse(raw);
      return {
        done: parsed.done || {},
        startDate: parsed.startDate || null,
        rerollOffset: parsed.rerollOffset || {}
      };
    } catch (e) {
      return { done: {}, startDate: null, rerollOffset: {} };
    }
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  var state = loadState();
  if (!state.startDate) {
    state.startDate = new Date().toISOString().slice(0, 10);
  }

  var sectionsEl = document.getElementById('sections');
  var jumpnavEl = document.getElementById('jumpnav');
  var startDateInput = document.getElementById('startDateInput');
  startDateInput.value = state.startDate;

  function itemId(catKey, idx) { return catKey + (idx + 1); }

  function renderSections() {
    sectionsEl.innerHTML = '';
    jumpnavEl.innerHTML = '';
    CATEGORIES.forEach(function (cat) {
      var a = document.createElement('a');
      a.href = '#section-' + cat.key;
      a.textContent = cat.key;
      jumpnavEl.appendChild(a);

      var section = document.createElement('div');
      section.className = 'page-section';
      section.id = 'section-' + cat.key;

      var doneCount = cat.items.filter(function (_, i) { return state.done[itemId(cat.key, i)]; }).length;

      var head = document.createElement('div');
      head.className = 'page-head';
      head.innerHTML =
        '<div class="page-letter">' + cat.key + '</div>' +
        '<h2>' + cat.name + '</h2>' +
        '<span class="page-count">' + doneCount + ' / ' + cat.items.length + '</span>';
      section.appendChild(head);

      var ul = document.createElement('ul');
      ul.className = 'item-list';
      cat.items.forEach(function (text, idx) {
        var id = itemId(cat.key, idx);
        var li = document.createElement('li');
        li.className = 'item-row' + (state.done[id] ? ' done' : '');
        li.innerHTML =
          '<button type="button" class="stamp-check" data-id="' + id + '" aria-label="완료 표시">' + checkIcon + '</button>' +
          '<span class="item-code">' + id + '</span>' +
          '<span class="item-text">' + text + '</span>';
        ul.appendChild(li);
      });
      section.appendChild(ul);
      sectionsEl.appendChild(section);
    });

    sectionsEl.querySelectorAll('.stamp-check').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-id');
        state.done[id] = !state.done[id];
        saveState();
        renderAll();
      });
    });
  }

  function totalCount() {
    var total = 0;
    CATEGORIES.forEach(function (c) { total += c.items.length; });
    return total;
  }

  function doneTotal() {
    return Object.keys(state.done).filter(function (k) { return state.done[k]; }).length;
  }

  function renderProgress() {
    var total = totalCount();
    var done = doneTotal();
    document.getElementById('progressFill').style.width = (done / total * 100) + '%';
    document.getElementById('progressCount').textContent = done + ' / ' + total;
  }

  function getWeekIndex() {
    var start = new Date(state.startDate + 'T00:00:00');
    var now = new Date();
    var diffDays = Math.floor((now - start) / 86400000);
    return Math.max(0, Math.floor(diffDays / 7));
  }

  function renderWeekCard() {
    var weekIndex = getWeekIndex();
    var cat = CATEGORIES[weekIndex % CATEGORIES.length];
    var cycle = Math.floor(weekIndex / CATEGORIES.length);
    var offset = state.rerollOffset[cat.key] || 0;
    var itemIdx = (cycle + offset) % cat.items.length;
    var id = itemId(cat.key, itemIdx);

    document.getElementById('weekNumber').textContent = (weekIndex + 1) + '주차';
    document.getElementById('weekCatTag').textContent = cat.key + ' · ' + cat.name;
    document.getElementById('weekItemText').textContent = cat.items[itemIdx];

    var doneBtn = document.getElementById('weekDoneBtn');
    var isDone = !!state.done[id];
    doneBtn.textContent = isDone ? '완료됨 ✓' : '이번 주 완료로 표시';
    doneBtn.classList.toggle('done', isDone);

    doneBtn.onclick = function () {
      state.done[id] = !state.done[id];
      saveState();
      renderAll();
      var target = document.querySelector('.stamp-check[data-id="' + id + '"]');
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };

    document.getElementById('weekRerollBtn').onclick = function () {
      state.rerollOffset[cat.key] = ((state.rerollOffset[cat.key] || 0) + 1) % cat.items.length;
      saveState();
      renderWeekCard();
    };
  }

  function renderAll() {
    renderSections();
    renderWeekCard();
    renderProgress();
  }

  startDateInput.addEventListener('change', function () {
    if (startDateInput.value) {
      state.startDate = startDateInput.value;
      saveState();
      renderAll();
    }
  });

  renderAll();
})();
</script>

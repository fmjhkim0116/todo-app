<title>할일 목록</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #f6f4ef;
    --surface: #ffffff;
    --surface-2: #f0ede5;
    --text: #22261f;
    --text-muted: #767a6d;
    --accent: #2f6f5e;
    --accent-soft: #dcece5;
    --accent-contrast: #f4faf7;
    --danger: #b3492f;
    --border: #e3ded2;
    --shadow: 0 1px 2px rgba(30, 30, 20, 0.04), 0 8px 24px -12px rgba(30, 30, 20, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15181a;
      --surface: #1d2124;
      --surface-2: #23282b;
      --text: #eae7dd;
      --text-muted: #93998e;
      --accent: #6bbba0;
      --accent-soft: #223731;
      --accent-contrast: #0f1a16;
      --danger: #e2836a;
      --border: #2b3033;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #15181a;
    --surface: #1d2124;
    --surface-2: #23282b;
    --text: #eae7dd;
    --text-muted: #93998e;
    --accent: #6bbba0;
    --accent-soft: #223731;
    --accent-contrast: #0f1a16;
    --danger: #e2836a;
    --border: #2b3033;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Work Sans", system-ui, sans-serif;
    padding-inline: 16px;
    padding-block: 40px;
    min-height: 100%;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .count {
    font-family: "JetBrains Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 0.8rem;
    color: var(--text-muted);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    white-space: nowrap;
  }

  form {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  #new-task {
    flex: 1 1 160px;
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 0.95rem;
    font-family: inherit;
  }
  #new-task:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  #new-task::placeholder { color: var(--text-muted); }

  #new-due {
    flex: 0 1 168px;
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 10px;
    font-size: 0.85rem;
    font-family: "JetBrains Mono", monospace;
  }
  #new-due:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  #new-due::-webkit-calendar-picker-indicator {
    filter: var(--calendar-icon-filter, none);
    cursor: pointer;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) #new-due::-webkit-calendar-picker-indicator { filter: invert(0.85); }
  }
  :root[data-theme="dark"] #new-due::-webkit-calendar-picker-indicator { filter: invert(0.85); }

  button {
    font-family: inherit;
    cursor: pointer;
  }
  .btn-add {
    background: var(--accent);
    color: var(--accent-contrast);
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 0.95rem;
    font-weight: 600;
  }
  .btn-add:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-add:disabled { opacity: 0.5; cursor: not-allowed; }

  .filters {
    display: flex;
    gap: 6px;
  }
  .filter-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.82rem;
    font-weight: 500;
  }
  .filter-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .filter-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }

  ul#list {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  li.task {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 14px;
    border-bottom: 1px solid var(--border);
  }
  li.task:last-child { border-bottom: none; }

  .check {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent-contrast);
  }
  .check[aria-checked="true"] {
    background: var(--accent);
    border-color: var(--accent);
  }
  .check svg { width: 13px; height: 13px; display: none; }
  .check[aria-checked="true"] svg { display: block; }
  .check:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .task-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .task-text {
    font-size: 0.95rem;
    word-break: break-word;
    cursor: text;
  }
  li.task.done .task-text {
    color: var(--text-muted);
    text-decoration: line-through;
  }
  .task-text[contenteditable="true"] {
    outline: none;
    border-bottom: 1px dashed var(--accent);
  }

  .due-row { display: flex; align-items: center; gap: 6px; }
  .due-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: "JetBrains Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 0.76rem;
    color: var(--text-muted);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 7px;
    cursor: pointer;
  }
  .due-badge svg { width: 11px; height: 11px; flex-shrink: 0; }
  .due-badge.overdue { color: var(--danger); border-color: var(--danger); }
  li.task.done .due-badge { color: var(--text-muted); border-color: var(--border); }
  .due-clear {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 0.9rem;
    line-height: 1;
    padding: 0 2px;
  }
  .due-clear:hover { color: var(--danger); }
  .set-time-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 0.76rem;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 0;
  }
  .set-time-btn svg { width: 11px; height: 11px; }
  .set-time-btn:hover { color: var(--accent); }
  .due-input {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.78rem;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 2px 6px;
  }

  .delete-btn {
    flex-shrink: 0;
    background: transparent;
    border: none;
    color: var(--text-muted);
    width: 26px;
    height: 26px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .delete-btn:hover { color: var(--danger); background: var(--surface-2); }
  .delete-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .delete-btn svg { width: 15px; height: 15px; }

  .empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 0.82rem;
    color: var(--text-muted);
  }
  .clear-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 0.82rem;
    text-decoration: underline;
    text-underline-offset: 2px;
    padding: 4px 0;
  }
  .clear-btn:hover { color: var(--danger); }
  .clear-btn:disabled { opacity: 0.4; cursor: not-allowed; text-decoration: none; }
  .clear-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  @media (prefers-reduced-motion: no-preference) {
    li.task { transition: background-color 0.15s ease; }
    .check, .check svg { transition: background-color 0.12s ease, border-color 0.12s ease; }
  }
</style>

<div class="app">
  <header>
    <h1>할일 목록</h1>
    <span class="count" id="count">0개 남음</span>
  </header>

  <form id="add-form">
    <input id="new-task" type="text" placeholder="할 일을 입력하세요" autocomplete="off" maxlength="200" />
    <input id="new-due" type="datetime-local" aria-label="시간 설정 (선택)" />
    <button type="submit" class="btn-add" id="add-btn">추가</button>
  </form>

  <div class="filters" role="group" aria-label="필터">
    <button class="filter-btn" data-filter="all" aria-pressed="true">전체</button>
    <button class="filter-btn" data-filter="active" aria-pressed="false">진행중</button>
    <button class="filter-btn" data-filter="done" aria-pressed="false">완료</button>
  </div>

  <ul id="list"></ul>

  <footer>
    <span id="footer-count"></span>
    <button class="clear-btn" id="clear-done">완료 항목 지우기</button>
  </footer>
</div>

<script>
(function () {
  var STORAGE_KEY = "todo-app.tasks.v1";
  var tasks = [];
  var filter = "all";

  function loadTasks() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      return parsed.filter(function (t) {
        return t && typeof t.id === "string" && typeof t.text === "string";
      });
    } catch (e) {
      return [];
    }
  }

  function saveTasks() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    } catch (e) {
      /* storage unavailable (private mode, quota) — state just won't persist */
    }
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  var listEl = document.getElementById("list");
  var countEl = document.getElementById("count");
  var footerCountEl = document.getElementById("footer-count");
  var clearBtn = document.getElementById("clear-done");
  var form = document.getElementById("add-form");
  var input = document.getElementById("new-task");
  var dueInput = document.getElementById("new-due");
  var filterBtns = document.querySelectorAll(".filter-btn");

  var checkIcon = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.7L13 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var trashIcon = '<svg viewBox="0 0 16 16" fill="none"><path d="M2.5 4.5H13.5M6 4.5V3a1 1 0 011-1h2a1 1 0 011 1v1.5M12.3 4.5L11.8 13a1 1 0 01-1 1H5.2a1 1 0 01-1-1L3.7 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var clockIcon = '<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.3"/><path d="M8 5v3.2L10 10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function formatDue(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return d.toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
  }

  function visibleTasks() {
    if (filter === "active") return tasks.filter(function (t) { return !t.done; });
    if (filter === "done") return tasks.filter(function (t) { return t.done; });
    return tasks;
  }

  function render() {
    var visible = visibleTasks();
    listEl.innerHTML = "";

    if (visible.length === 0) {
      var empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = tasks.length === 0 ? "할 일을 추가해보세요." : "표시할 항목이 없습니다.";
      listEl.appendChild(empty);
    } else {
      visible.forEach(function (task) {
        var li = document.createElement("li");
        li.className = "task" + (task.done ? " done" : "");

        var check = document.createElement("button");
        check.className = "check";
        check.type = "button";
        check.setAttribute("role", "checkbox");
        check.setAttribute("aria-checked", String(task.done));
        check.setAttribute("aria-label", "완료 표시");
        check.innerHTML = checkIcon;
        check.addEventListener("click", function () {
          task.done = !task.done;
          saveTasks();
          render();
        });

        var body = document.createElement("div");
        body.className = "task-body";

        var text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;
        text.title = "더블클릭하여 수정";
        text.addEventListener("dblclick", function () {
          text.contentEditable = "true";
          text.focus();
          document.execCommand("selectAll", false, null);
        });
        function commitEdit() {
          text.contentEditable = "false";
          var newText = text.textContent.trim();
          if (newText) {
            task.text = newText;
            saveTasks();
          } else {
            text.textContent = task.text;
          }
        }
        text.addEventListener("blur", commitEdit);
        text.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { e.preventDefault(); text.blur(); }
          if (e.key === "Escape") { text.textContent = task.text; text.blur(); }
        });

        var dueRow = document.createElement("div");
        dueRow.className = "due-row";

        function toLocalInputValue(iso) {
          var d = new Date(iso);
          var pad = function (n) { return String(n).padStart(2, "0"); };
          return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
        }

        function openDueEditor(existingIso) {
          dueRow.innerHTML = "";
          var editor = document.createElement("input");
          editor.type = "datetime-local";
          editor.className = "due-input";
          if (existingIso) editor.value = toLocalInputValue(existingIso);
          dueRow.appendChild(editor);
          editor.focus();
          function commit() {
            if (editor.value) {
              var d = new Date(editor.value);
              if (!isNaN(d.getTime())) {
                task.dueAt = d.toISOString();
                saveTasks();
              }
            }
            render();
          }
          editor.addEventListener("blur", commit);
          editor.addEventListener("keydown", function (e) {
            if (e.key === "Enter") { e.preventDefault(); editor.blur(); }
            if (e.key === "Escape") { render(); }
          });
        }

        if (task.dueAt) {
          var isOverdue = !task.done && new Date(task.dueAt).getTime() < Date.now();
          var badge = document.createElement("button");
          badge.type = "button";
          badge.className = "due-badge" + (isOverdue ? " overdue" : "");
          badge.innerHTML = clockIcon + "<span>" + formatDue(task.dueAt) + "</span>";
          badge.title = "클릭하여 시간 변경";
          badge.addEventListener("click", function () { openDueEditor(task.dueAt); });

          var clearDue = document.createElement("button");
          clearDue.type = "button";
          clearDue.className = "due-clear";
          clearDue.setAttribute("aria-label", "시간 제거");
          clearDue.textContent = "×";
          clearDue.addEventListener("click", function () {
            delete task.dueAt;
            saveTasks();
            render();
          });

          dueRow.appendChild(badge);
          dueRow.appendChild(clearDue);
        } else {
          var setTimeBtn = document.createElement("button");
          setTimeBtn.type = "button";
          setTimeBtn.className = "set-time-btn";
          setTimeBtn.innerHTML = clockIcon + "<span>시간 설정</span>";
          setTimeBtn.addEventListener("click", function () { openDueEditor(null); });
          dueRow.appendChild(setTimeBtn);
        }

        body.appendChild(text);
        body.appendChild(dueRow);

        var del = document.createElement("button");
        del.className = "delete-btn";
        del.type = "button";
        del.setAttribute("aria-label", "삭제");
        del.innerHTML = trashIcon;
        del.addEventListener("click", function () {
          tasks = tasks.filter(function (t) { return t.id !== task.id; });
          saveTasks();
          render();
        });

        li.appendChild(check);
        li.appendChild(body);
        li.appendChild(del);
        listEl.appendChild(li);
      });
    }

    var remaining = tasks.filter(function (t) { return !t.done; }).length;
    var doneCount = tasks.length - remaining;
    countEl.textContent = remaining + "개 남음";
    footerCountEl.textContent = tasks.length === 0 ? "" : "전체 " + tasks.length + "개 · 완료 " + doneCount + "개";
    clearBtn.disabled = doneCount === 0;
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var value = input.value.trim();
    if (!value) return;
    var task = { id: uid(), text: value, done: false };
    if (dueInput.value) {
      var d = new Date(dueInput.value);
      if (!isNaN(d.getTime())) task.dueAt = d.toISOString();
    }
    tasks.unshift(task);
    input.value = "";
    dueInput.value = "";
    saveTasks();
    render();
  });

  clearBtn.addEventListener("click", function () {
    tasks = tasks.filter(function (t) { return !t.done; });
    saveTasks();
    render();
  });

  filterBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      filter = btn.dataset.filter;
      filterBtns.forEach(function (b) { b.setAttribute("aria-pressed", String(b === btn)); });
      render();
    });
  });

  tasks = loadTasks();
  render();
})();
</script>

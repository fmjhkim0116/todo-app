<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>홍길동</title>
  <meta name="description" content="홍길동의 자기소개 페이지 - 코드와 커피, 책과 산책을 좋아합니다" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg-start: #f8fafc;
      --bg-end: #e0f2fe;
      --accent: #0ea5e9;
      --accent-contrast: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --card-bg: rgba(255, 255, 255, 0.7);
      --card-border: rgba(255, 255, 255, 0.6);
      --chip-bg: #f1f5f9;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 20px 40px -20px rgba(15, 23, 42, 0.2);
      --shadow-hover: 0 1px 2px rgba(15, 23, 42, 0.06), 0 28px 52px -20px rgba(15, 23, 42, 0.28);
      --radius: 20px;
      --gap: 24px;
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      background: linear-gradient(160deg, var(--bg-start) 0%, var(--bg-end) 100%);
      background-attachment: fixed;
      color: var(--text);
      font-family: 'Pretendard', -apple-system, 'Noto Sans KR', sans-serif;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--gap);
      text-align: center;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-hover);
    }

    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-contrast);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.1rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .name {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .intro {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.6;
    }

    .tags {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .tag {
      display: inline-block;
      background: var(--chip-bg);
      color: var(--text);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 0.85rem;
      font-weight: 500;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .tag:hover {
      background: var(--accent);
      color: var(--accent-contrast);
    }

    .socials {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.6);
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .social-link:hover {
      transform: translateY(-2px);
      background: #ffffff;
    }

    .social-link:focus-visible,
    .tag:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .social-link svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: no-preference) {
      .card { animation: fadeInUp 0.6s ease both; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }

    @media (max-width: 480px) {
      body { padding: 16px; }
      .card { padding: 32px 22px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar" aria-hidden="true">홍</div>
    <h1 class="name">홍길동</h1>
    <p class="intro">코드와 커피, 책과 산책을 좋아합니다</p>

    <ul class="tags">
      <li class="tag">독서</li>
      <li class="tag">여행</li>
      <li class="tag">사진</li>
      <li class="tag">커피</li>
    </ul>

    <nav class="socials" aria-label="소셜 링크">
      <a class="social-link" href="https://github.com/사용자명" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        <span>GitHub</span>
      </a>
      <a class="social-link" href="https://linkedin.com/in/사용자명" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 11.001-4.124 2.062 2.062 0 01-.001 4.124zM7.114 20.452H3.558V9h3.556v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
        </svg>
        <span>LinkedIn</span>
      </a>
    </nav>
  </main>
</body>
</html>
